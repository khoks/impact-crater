# LLM routing config — per ADR-0009 (cost-tiered per-operation model lineup).
#
# Maps each operation to a (provider, model, model_version, tier, defaults).
# Loaded at startup by `LLMRouter` (backend/impact_crater/llm_clients/router.py).
# Per-user overrides flow through settings.routing_overrides (ADR-0006).
# Per-job overrides flow through the effort-level UX (D-013 / A-015).
#
# This file is the source of truth for which model serves which operation
# (ADR-0009 amendment 2026-10-25). Every operation here has an `LLMRouter`
# method and `pipeline/runner.py::_TIER_BY_OPERATION` mirrors it
# (tests/test_routing_config_integrity.py). S-2.10.9 bumps the IDs and pins
# real `model_version` tokens.
#
# Tiers (ADR-0009):
#   S — Tier-S Gemini Flash (cheap, bulk, vision-language)
#   M — Tier-M Claude Sonnet (structured output)
#   L — Tier-L Claude Opus (one-call-per-job heavy reasoning)
#   embedding — Google embedding model (not on the S/M/L axis)
#
# `model_version` is a free-form opaque token that participates in the cache key
# (ADR-0006 cache_index, A-011 / N-007). Bump it to invalidate cache entries
# when the upstream provider rolls a model in place.

defaults:
  max_tokens: 1024
  temperature: 0.0

operations:

  # ---- Embedding -------------------------------------------------------
  embed_image:
    provider: google
    model: gemini-embedding-001
    model_version: v1
    tier: embedding
  embed_text:
    provider: google
    model: gemini-embedding-001
    model_version: v1
    tier: embedding

  # ---- Tier-S (bulk, cheap) -------------------------------------------
  caption_image:
    provider: google
    model: gemini-2.5-flash
    model_version: v1
    tier: S
    max_tokens: 256
  score_image:
    provider: google
    model: gemini-2.5-flash
    model_version: v1
    tier: S
    # Gemini emits a "Here is..." preamble before the JSON; the schema-hint
    # suffix is supposed to suppress it but doesn't reliably. Give the model
    # enough headroom to recover with the JSON even after a short preamble.
    max_tokens: 256
  # S-2.11.7 — clean 2–5 word splash-card title from the brief + year. One
  # cheap call per title-card job; the stage falls back to a heuristic on any
  # failure (missing key, quota-denied, empty output). Slight temperature for
  # a touch of flair without drifting off the brief.
  generate_title_text:
    provider: google
    model: gemini-2.5-flash
    model_version: v1
    tier: S
    max_tokens: 64
    temperature: 0.5

  # ---- Tier-M (structured output) --------------------------------------
  # extract_metadata_image also serves video-scene frames: Stage 3 passes the
  # RichMetadataVideoScene schema for scenes (there is no separate op).
  extract_metadata_image:
    provider: anthropic
    model: claude-sonnet-4-6
    model_version: latest
    tier: M
    max_tokens: 2048
  # parse_user_brief also carries Stage 0.5 brief intent, the Stage 6.5
  # second-guess and the Stage 9 refinement planner (ADR-0021).
  parse_user_brief:
    provider: anthropic
    model: claude-sonnet-4-6
    model_version: latest
    tier: M
    max_tokens: 1024
  # S-2.11.5 opt-in AI title/splash card background (remote image-gen per D-054).
  # One call per job, only when the user opts in; fail-soft to a typographic card.
  generate_title_background:
    provider: google
    model: gemini-2.5-flash-image
    model_version: v1
    tier: M
    max_tokens: 1024
    temperature: 0.6

  # ---- Tier-L (heavy reasoning, one-call-per-job) ---------------------
  judge_narrative_arc:
    provider: anthropic
    model: claude-opus-4-8
    model_version: latest
    tier: L
    # 8192: snappy 2-3s clips mean ~40-60 selected_items for a 120s video
    # (S-2.11.1) — 4096 truncated the tool call at that clip count.
    max_tokens: 8192
