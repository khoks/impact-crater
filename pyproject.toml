[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "impact-crater"
version = "0.0.1"
description = "One-click media-to-video creator: drop photos and videos, describe the video you want, and the AI selects, sequences, scores and renders it. Self-hosted, source-available under BSL 1.1."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Rahul Singh Khokhar" }]
keywords = ["video", "photo", "media", "ai", "llm", "ffmpeg", "youtube", "instagram", "reels", "self-hosted"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Video",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # fastapi 0.136 / starlette 1.0 are what the lock file pins; the full suite
    # passes against that major (2026-10-24), so the floor stays and a <1 cap guards fastapi.
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "aiosqlite>=0.20",
    "aiofiles>=24.1",
    "cryptography>=43.0",
    # M1 LLM stack
    "anthropic>=0.40,<1",
    "google-genai>=1.0,<2",
    "tenacity>=9.0",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "numpy>=2.0,<3",
    # M1 media pipeline
    "pillow>=11.0",
    "pillow-heif>=0.21",
    "imagehash>=4.3",
    "scenedetect[opencv-headless]>=0.6.5",
    "ffmpeg-python>=0.2",
    # M4 music analysis. Madmom was the ADR-0012 first choice but does not
    # build on Python 3.12 (last release 2024-01, predates 3.12). librosa
    # alone covers beats + sections + energy at MVP-acceptable accuracy;
    # the MusicAnalyzer abstraction lets v1 swap to BeatNet/Madmom when
    # the local-LLM runtime brings torch into deps anyway.
    "librosa>=0.11,<0.12",
    "soundfile>=0.13",
    # M5 privacy + face detection. ADR-0010 named pyexiv2 + dlib's
    # face-recognition; we substitute piexif (pure Python) + mediapipe
    # (pre-built wheels for Python 3.12 + Windows).
    "piexif>=1.1",
    "mediapipe>=0.10,<0.11",
    # M7 YouTube connector per ADR-0013.
    "google-auth-oauthlib>=1.2",
    "google-api-python-client>=2.150",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-mock>=3.14",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.13",
    "python-dotenv>=1.0",
    "types-PyYAML>=6.0",
]

[project.scripts]
impact-crater = "impact_crater.cli:main"

[project.urls]
Homepage = "https://github.com/khoks/impact-crater"
Repository = "https://github.com/khoks/impact-crater"
Issues = "https://github.com/khoks/impact-crater/issues"

[tool.setuptools]
package-dir = { "" = "backend" }

[tool.setuptools.packages.find]
where = ["backend"]
include = ["impact_crater*"]

[tool.setuptools.package-data]
"impact_crater" = [
    "storage/migrations_sql/*.sql",
    "frontend_dist/**/*",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["frontend/dist", "frontend/node_modules"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF",
]
ignore = [
    "E501",
]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["backend/impact_crater"]
exclude = ["build/", "dist/", "frontend/"]

[[tool.mypy.overrides]]
module = [
    "aiosqlite.*",
    "imagehash.*",
    "scenedetect.*",
    "ffmpeg.*",
    "pillow_heif.*",
    "librosa.*",
    "soundfile.*",
    "piexif.*",
    "insightface.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
]
markers = [
    "integration: hits real Anthropic / Google APIs; gated behind --integration",
]

[tool.coverage.run]
source = ["backend/impact_crater"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
