name: Publish docs site (GitHub Pages)

# Builds the external-facing product & architecture overview into a themed
# static site (MkDocs Material — renders the Mermaid diagrams) and deploys it
# to GitHub Pages. Only docs/OVERVIEW.md is published; the internal
# architecture / decision / vision docs are intentionally excluded.

on:
  push:
    branches: [master]
    paths:
      - docs/OVERVIEW.md
      - mkdocs.yml
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress publish.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install MkDocs Material
        run: pip install "mkdocs-material>=9.5"
      - name: Assemble external-facing site (overview only)
        run: |
          mkdir -p site-src
          cp docs/OVERVIEW.md site-src/index.md
      - name: Build site
        run: mkdocs build
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
