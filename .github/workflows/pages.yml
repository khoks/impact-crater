name: Publish docs site (GitHub Pages)

# Builds the external-facing product & architecture overview into a themed
# static site (MkDocs Material — renders the Mermaid diagrams) and deploys it
# to GitHub Pages. Only docs/OVERVIEW.md is published; the internal
# architecture / decision / vision docs are intentionally excluded.

on:
  push:
    branches: [master]
    paths:
      - docs/OVERVIEW.md
      - docs/From_Raw_Media_to_Masterpiece.png
      - docs/banner.png
      - docs/logo.png
      - mkdocs.yml
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress publish.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install MkDocs Material
        run: pip install "mkdocs-material>=9.5"
      - name: Assemble external-facing site (overview only)
        run: |
          mkdir -p site-src
          cp docs/OVERVIEW.md site-src/index.md
          cp docs/From_Raw_Media_to_Masterpiece.png site-src/
          cp docs/banner.png site-src/
          cp docs/logo.png site-src/
      - name: Build site
        run: mkdocs build
      - name: Configure Pages
        # Pages is enabled out-of-band (source = GitHub Actions); the
        # workflow token can't create the Pages site itself, so we don't
        # request enablement here — just read the existing config.
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
