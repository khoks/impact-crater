name: CI

# Lint, type-check and test every PR and every push to master. The paid
# `--integration` suite never runs here (it calls the real Anthropic / Google
# APIs); see CLAUDE.md "Coding standards".

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg libgl1
      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - name: Install the package from the lock file
        run: |
          python -m pip install -r requirements-lock.txt
          python -m pip install -e ".[dev]" --no-deps
      - name: ruff check
        run: ruff check backend/impact_crater tests scripts
      - name: ruff format --check
        run: ruff format --check backend/impact_crater tests scripts
      - name: mypy --strict
        run: mypy
      - name: pytest (non-integration, with coverage)
        run: python -m pytest -q --cov --cov-report=term

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docs:
    name: Docs site build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Same pins as requirements-lock.txt and pages.yml. MkDocs 2.0 drops the
      # plugin system Material depends on, so mkdocs itself is pinned too.
      - name: Install MkDocs Material
        run: python -m pip install "mkdocs==1.6.1" "mkdocs-material==9.7.6"
      - name: Assemble external-facing site (overview only)
        run: |
          mkdir -p site-src
          cp docs/OVERVIEW.md site-src/index.md
          cp docs/From_Raw_Media_to_Masterpiece.png site-src/
          cp docs/banner.png site-src/
          cp docs/logo.png site-src/
      - name: mkdocs build --strict
        run: mkdocs build --strict
