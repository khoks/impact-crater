# Dependabot — version-update PRs for the three ecosystems in this repo.
# PRs are reviewed and merged by the maintainer; nothing here auto-merges
# (ADR-0004 covers Claude-generated PRs only). Dependency installs still follow
# CLAUDE.md: no `pip install` / `npm install` in a session without approval.
#
# Shape (2026-10-25): monthly, minor + patch grouped into one PR per ecosystem,
# majors ignored (each major is a deliberate migration — S-3.11.5 for the
# frontend, S-3.11.4 / S-3.11.6 for Python), small open-PR caps, no labels
# (the labels named earlier did not exist in the repo). Security updates are
# a repository setting (Settings → Code security), independent of this file.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
